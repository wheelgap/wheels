name: Pages

# Builds the index (simple/), the page and data/gap-wheels.json from data/gap-wheels.json and deploys them to
# https://wheelgap.github.io/wheels/. The publish job of gap-wheels.yml starts this after committing the index (a push
# made with the workflow's token doesn't trigger workflows). Runs only our own code.
#
# Each project page also lists PyPI's own files for that project (so uv, which takes a package from one index, sees
# every release), so it runs hourly to pick up new uploads. If PyPI can't be read the hourly build fails and nothing is
# deployed: the previous index stays up rather than one with files missing, and the failed run emails the maintainers.

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/build_gap_index.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the index and page
        # The hourly run keeps the last good index when PyPI can't be read. A push or a manual run (a takedown, an
        # opt-out) deploys anyway, leaving out any project PyPI can't be read for, so removals never wait on PyPI.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            python3 scripts/build_gap_index.py data/gap-wheels.json _site
          else
            python3 scripts/build_gap_index.py --omit-failing data/gap-wheels.json _site
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
