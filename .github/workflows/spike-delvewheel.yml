name: Spike delvewheel (temporary)

# A throwaway spike for LightGBM on Windows ARM64 (see spike/run.py). Never merged.

on:
  pull_request:
    paths: [spike/**, .github/workflows/spike-delvewheel.yml]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
        include:
          - python: "3.14"
            abi: cp314
    runs-on: windows-11-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build, bundle, retag, test
        shell: bash
        run: python spike/run.py lightgbm 4.7.0 cp314 ${{ matrix.abi }} win_arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-${{ matrix.attempt }}
          path: report.json
          if-no-files-found: ignore
